<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adesão aos Cursos Pré-Congresso</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

    <div class="container mt-5">
        
        <h2 class="text-center text-secondary fw-normal mb-2">
            ADESÃO AOS CURSOS PRÉ-CONGRESSO
        </h2>
        <div class="mx-auto bg-primary mb-4" style="width: 50px; height: 3px;"></div>

        <div class="table-responsive">
            <table class="table text-center align-middle mb-4">
                
                <thead>
                    <tr>
                        <th class="bg-warning text-white py-3 w-50">
                            CATEGORIA
                        </th>
                        <th class="bg-info text-white py-3 w-50">
                            VALOR DOS CURSOS
                        </th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <th class="bg-light text-start ps-5 py-3 fw-normal">
                            Profissionais (inscritos no congresso)
                        </th>
                        <td class="bg-info-subtle py-3">
                            R$ 80,00
                        </td>
                    </tr>

                    <tr>
                        <th class="bg-light text-start ps-5 py-3 fw-normal">
                            Estudantes (inscritos no congresso)
                        </th>
                        <td class="bg-info-subtle py-3">
                            R$ 60,00
                        </td>
                    </tr>

                    <tr>
                        <th class="bg-light text-start ps-5 py-3 fw-normal">
                            Inscrição somente no curso<br>
                            <span class="fst-italic">(sem adesão ao congresso)</span>
                        </th>
                        <td class="bg-info-subtle py-3">
                            R$ 160,00
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>

        <div class="text-center mt-3">
            <a href="#" class="btn btn-success px-4 py-2 text-uppercase">
                CONHEÇA NOSSOS CURSOS
            </a>
        </div>

    </div>

</body>
</html>
