<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <div class="container mt-4">

        <form>

            <div class="row g-3">
                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome Fantasia ou primeiro nome</label>
                    <input type="text" class="form-control" id="nome">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Pessoa</label>

                    <div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="pessoa" id="fisica" value="fisica">
                            <label class="form-check-label" for="fisica">Física</label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="pessoa" id="juridica" value="juridica">
                            <label class="form-check-label" for="juridica">Jurídica</label>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <label for="razao" class="form-label">Razão</label>
                    <input type="text" class="form-control" id="razao">
                </div>

                <div class="col-md-4">
                    <label for="cnpj" class="form-label">CNPJ</label>
                    <input type="text" class="form-control" id="cnpj" placeholder="00.000.000/0000-00">
                </div>

                <div class="col-md-8">
                    <label for="endereco" class="form-label">Endereço</label>
                    <input type="text" class="form-control" id="endereco">
                </div>

                <div class="col-md-4">
                    <label for="bairro" class="form-label">Bairro</label>
                    <input type="text" class="form-control" id="bairro">
                </div>

                <div class="col-md-6">
                    <label for="cidade" class="form-label">Cidade</label>
                    <input type="text" class="form-control" id="cidade">
                </div>

                <div class="col-md-3">
                    <label for="estado" class="form-label">Estado</label>
                    <select class="form-select" id="estado">
                        <option selected>Minas Gerais</option>
                        <option>São Paulo</option>
                        <option>Rio de Janeiro</option>
                        <option>Paraná</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label for="cep" class="form-label">CEP</label>
                    <input type="text" class="form-control" id="cep" placeholder="00000-000">
                </div>

                <div class="col-md-4">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="text" class="form-control" id="telefone">
                </div>

                <div class="col-md-4">
                    <label for="celular" class="form-label">Celular</label>
                    <input type="text" class="form-control" id="celular">
                </div>

                <div class="col-md-4">
                    <label for="fax" class="form-label">Fax</label>
                    <input type="text" class="form-control" id="fax">
                </div>

                <div class="col-md-6">
                    <label for="contato" class="form-label">Contato</label>
                    <input type="text" class="form-control" id="contato">
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email">
                </div>

                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="avisos" checked>
                        <label class="form-check-label" for="avisos">
                            Receber e-mails de aviso sobre novas licitações
                        </label>
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label" for="micro">Tipo de empresa</label>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipoEmpresa" id="micro" value="micro">
                        <label class="form-check-label" for="micro">
                            MICRO EMPRESAS / EMPRESAS DE PEQUENO PORTE
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipoEmpresa" id="demais" value="demais">
                        <label class="form-check-label" for="demais">
                            DEMAIS FORMAS DE CONSTITUIÇÃO
                        </label>
                    </div>
                </div>

                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary">
                        Salvar cadastro
                    </button>
                </div>

                <div class="col-12 mt-4">
                    <p class="aviso">
                        ATENÇÃO: Este cadastro não substitui o cadastro de fornecedores do município de São Sebastião do Paraíso
                    </p>
                </div>

            </div>

        </form>

    </div>

</body>
</html>
